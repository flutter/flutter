version: "3"

vars:
  PY312_BIN: /home/dev/.local/share/uv/python/cpython-3.12.12-linux-x86_64-gnu/bin
  DEPOT_TOOLS: /home/dev/depot_tools
  ENGINE_SRC: '{{.TASKFILE_DIR}}/engine/src'
  LOCAL_ENGINE: host_debug
  BUNDLED_DEPOT_TOOLS: '{{.ENGINE_SRC}}/flutter/third_party/depot_tools'
  RUST_SHELL_SAMPLE: /run/media/dev/33da92da-1869-46ee-a0c1-fd5c4c9049e5/@home/dev/1tb_desktop/1tboss/bug
  RUST_WINDOWING_EXAMPLE: '{{.TASKFILE_DIR}}/examples/multiple_windows'
  RUST_TEXTURE_EXAMPLE: '{{.TASKFILE_DIR}}/examples/texture'
  RUST_FRB_FIXTURE: '{{.ENGINE_SRC}}/flutter/shell/platform/rust/tests/frb_fixture'
  RESIZE_ITERATIONS: 500
  LIFECYCLE_ITERATIONS: 20
  TEXTURE_LIFECYCLE_ITERATIONS: 40
  RUST_SHELL_DIR: '{{.ENGINE_SRC}}/flutter/shell/platform/rust'

tasks:
  fmt:
    desc: Run the engine formatting checks (requires depot_tools and Python <=3.12 for yapf) and format the Rust shell.
    cmds:
      - task: fmt-engine
      - task: fmt-rust

  fmt-engine:
    internal: true
    dir: engine/src/flutter
    cmds:
      - PATH="{{.PY312_BIN}}:{{.DEPOT_TOOLS}}:$PATH" ./ci/format.sh

  fmt-rust:
    desc: Format all Rust shell crates with cargo fmt.
    dir: '{{.RUST_SHELL_DIR}}'
    cmds:
      - cargo fmt --all

  fix-rust-lints:
    desc: Auto-fix cargo clippy lints across all Rust shell packages.
    dir: '{{.RUST_SHELL_DIR}}'
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged

  push:
    desc: Push changes (requires depot_tools in PATH)
    cmds:
      - PATH="{{.DEPOT_TOOLS}}:$PATH" git push

  build-rust-shell:
    desc: Build the host-debug Flutter Rust shell runner and shared engine.
    cmds:
      - |
        PATH="{{.BUNDLED_DEPOT_TOOLS}}:$PATH" \
        VPYTHON_BYPASS="manually managed python not supported by chrome operations" \
          /usr/bin/ninja -C {{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}} \
            flutter_rust_shell_runner libflutter_rust_engine.so \
            dart_sdk frontend_server_aot

  run-rust-multiple-windows:
    desc: Build and run Flutter's multiple_windows example on the Rust shell.
    deps: [build-rust-shell]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/flutter config --enable-windowing'
      - |
        cd {{.RUST_WINDOWING_EXAMPLE}}
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        {{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner \
          {{.RUST_WINDOWING_EXAMPLE}}/build/flutter_assets \
          {{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat

  test-rust-shell-texture:
    desc: Verify animated source-linked wgpu texture frames through a real Dart Texture widget.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the native texture test.
      - sh: command -v grim >/dev/null
        msg: grim is required to verify that the rendered texture pixels change.
    cmds:
      - |
        cd {{.RUST_TEXTURE_EXAMPLE}}
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --target=lib/rust_shell_main.dart \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        python3 {{.ENGINE_SRC}}/flutter/shell/platform/rust/tests/test_texture.py \
          --runner={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner \
          --assets={{.RUST_TEXTURE_EXAMPLE}}/build/flutter_assets \
          --icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat

  test-rust-shell-pixel-buffer-texture:
    desc: Verify zero-copy-to-shell CPU pixel-buffer frames through a real Dart Texture widget.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the native texture test.
      - sh: command -v grim >/dev/null
        msg: grim is required to verify that the rendered texture pixels change.
    cmds:
      - |
        cd {{.RUST_TEXTURE_EXAMPLE}}
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --target=lib/rust_shell_main.dart \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        python3 {{.ENGINE_SRC}}/flutter/shell/platform/rust/tests/test_texture.py \
          --pixel-buffer \
          --runner={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner \
          --assets={{.RUST_TEXTURE_EXAMPLE}}/build/flutter_assets \
          --icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat

  test-rust-shell-texture-lifecycle:
    desc: Stress live wgpu/pixel texture replacement, resize, unregister, and reclamation.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the native texture test.
      - sh: command -v grim >/dev/null
        msg: grim is required to verify that rendered texture pixels change.
    cmds:
      - |
        cd {{.RUST_TEXTURE_EXAMPLE}}
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --target=lib/rust_shell_main.dart \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        python3 {{.ENGINE_SRC}}/flutter/shell/platform/rust/tests/test_texture.py \
          --lifecycle-iterations={{.TEXTURE_LIFECYCLE_ITERATIONS}} \
          --runner={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner \
          --assets={{.RUST_TEXTURE_EXAMPLE}}/build/flutter_assets \
          --icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat

  test-rust-shell-frb-dispatch:
    desc: Verify FRB isolate dispatch plus wgpu and pixel-buffer textures end to end.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the native FRB dispatch test.
      - sh: command -v grim >/dev/null
        msg: grim is required to verify both FRB texture producers.
    cmds:
      - |
        cd {{.RUST_FRB_FIXTURE}}
        {{.TASKFILE_DIR}}/bin/flutter pub get
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --target=lib/main.dart \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        cd {{.RUST_FRB_FIXTURE}}/rust
        FLUTTER_RUST_ENGINE_DIR={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}} \
          cargo +1.93.1 build --locked --features runner \
            --bin flutter-rust-shell-frb-fixture
      - |
        python3 {{.ENGINE_SRC}}/flutter/shell/platform/rust/tests/test_frb_dispatch.py \
          --runner={{.RUST_FRB_FIXTURE}}/rust/target/debug/flutter-rust-shell-frb-fixture \
          --assets={{.RUST_FRB_FIXTURE}}/build/flutter_assets \
          --icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat

  test-rust-shell-lifecycle:
    desc: Repeatedly verify deterministic Rust-shell startup and compositor-driven shutdown.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the native lifecycle test.
      - sh: command -v jq >/dev/null
        msg: jq is required to locate the runner window.
    cmds:
      - |
        cd {{.RUST_SHELL_SAMPLE}}
        {{.TASKFILE_DIR}}/bin/flutter build bundle --debug \
          --local-engine={{.LOCAL_ENGINE}} \
          --local-engine-host={{.LOCAL_ENGINE}} \
          --local-engine-src-path={{.ENGINE_SRC}}
      - |
        runner={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner
        assets={{.RUST_SHELL_SAMPLE}}/build/flutter_assets
        icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat
        for iteration in $(seq 1 {{.LIFECYCLE_ITERATIONS}}); do
          lifecycle_log=$(mktemp /tmp/flutter-rust-lifecycle.XXXXXX.log)
          status_file=$(mktemp /tmp/flutter-rust-lifecycle-status.XXXXXX)
          unlink "$status_file"
          /usr/bin/bash -c \
            '"$1" "$2" "$3" >"$4" 2>&1; code=$?; printf "%s\n" "$code" >"$5"' \
            lifecycle-wrapper "$runner" "$assets" "$icu" "$lifecycle_log" "$status_file" &
          runner_pid=""
          for _ in $(seq 1 20); do
            runner_pid=$(pgrep -n -f "^$runner $assets $icu$")
            [ -n "$runner_pid" ] && break
            sleep 0.05
          done
          if [ -z "$runner_pid" ]; then
            echo "Lifecycle iteration $iteration did not start a runner; log: $lifecycle_log" >&2
            cat "$lifecycle_log" >&2
            exit 1
          fi
          address=""
          for _ in $(seq 1 400); do
            address=$(hyprctl clients -j | jq -r --arg pid "$runner_pid" \
              '.[] | select((.pid | tostring) == $pid and .title == "Flutter Rust Shell") | .address')
            [ -n "$address" ] && break
            kill -0 "$runner_pid" 2>/dev/null || break
            sleep 0.05
          done
          if [ -z "$address" ]; then
            echo "Lifecycle iteration $iteration did not map a window; log: $lifecycle_log" >&2
            kill -KILL "$runner_pid" 2>/dev/null || true
            cat "$lifecycle_log" >&2
            exit 1
          fi
          hyprctl dispatch closewindow "address:$address" >/dev/null
          for _ in $(seq 1 100); do
            kill -0 "$runner_pid" 2>/dev/null || break
            sleep 0.05
          done
          if kill -0 "$runner_pid" 2>/dev/null; then
            echo "Lifecycle iteration $iteration did not stop; log: $lifecycle_log" >&2
            kill -KILL "$runner_pid" 2>/dev/null || true
            exit 1
          fi
          for _ in $(seq 1 100); do
            [ -s "$status_file" ] && break
            sleep 0.01
          done
          if [ ! -s "$status_file" ] || [ "$(cat "$status_file")" -ne 0 ]; then
            echo "Lifecycle iteration $iteration exited unsuccessfully; log: $lifecycle_log" >&2
            cat "$lifecycle_log" >&2
            exit 1
          fi
          unlink "$lifecycle_log"
          unlink "$status_file"
        done
        echo "Rust-shell lifecycle passed ({{.LIFECYCLE_ITERATIONS}} startup/shutdown iterations)."

  stress-rust-shell:
    desc: Stress Vulkan synchronization and verify input/resize frame liveness under compositor-driven timing.
    deps: [build-rust-shell]
    preconditions:
      - sh: command -v hyprctl >/dev/null
        msg: Hyprland's hyprctl is required for the compositor stress test.
      - sh: command -v jq >/dev/null
        msg: jq is required to locate the runner window.
      - sh: test -f {{.RUST_SHELL_SAMPLE}}/build/flutter_assets/kernel_blob.bin
        msg: Build the sample Flutter bundle first or override RUST_SHELL_SAMPLE.
    cmds:
      - |
        runner={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/flutter_rust_shell_runner
        assets={{.RUST_SHELL_SAMPLE}}/build/flutter_assets
        icu={{.ENGINE_SRC}}/out/{{.LOCAL_ENGINE}}/icudtl.dat
        stress_log=$(mktemp /tmp/flutter-rust-vulkan-stress.XXXXXX.log)
        presentation_stats=$(mktemp /tmp/flutter-rust-presentation-stats.XXXXXX.log)
        validation_layer=""
        if vulkaninfo 2>/dev/null | grep -q VK_LAYER_KHRONOS_validation; then
          validation_layer=VK_LAYER_KHRONOS_validation
        else
          echo "VK_LAYER_KHRONOS_validation is unavailable; using wgpu and Impeller debug validation."
        fi

        VK_INSTANCE_LAYERS="$validation_layer" \
        FLUTTER_RUST_PRESENTATION_STATS="$presentation_stats" \
        RUST_LOG=wgpu_core=warn,wgpu_hal=warn \
          "$runner" "$assets" "$icu" >"$stress_log" 2>&1 &
        runner_pid=""
        cleanup() {
          if [ -n "$runner_pid" ] && kill -0 "$runner_pid" 2>/dev/null; then
            kill "$runner_pid" 2>/dev/null || true
          fi
          [ -z "$runner_pid" ] || wait "$runner_pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        address=""
        for _ in $(seq 1 100); do
          address=$(hyprctl clients -j | jq -r \
            '.[] | select(.title == "Flutter Rust Shell") | .address' | tail -n1)
          if [ -n "$address" ]; then
            runner_pid=$(hyprctl clients -j | jq -r --arg address "$address" \
              '.[] | select(.address == $address) | .pid')
            break
          fi
          sleep 0.05
        done
        if [ -z "$address" ]; then
          echo "Flutter Rust shell window did not appear; log: $stress_log" >&2
          cat "$stress_log" >&2
          exit 1
        fi

        for _ in $(seq 1 100); do
          [ -s "$presentation_stats" ] && break
          sleep 0.05
        done
        if [ ! -s "$presentation_stats" ]; then
          echo "Flutter Rust shell did not present its initial frame; stats: $presentation_stats; log: $stress_log" >&2
          exit 1
        fi

        # Focus the sample, let focus-driven frames settle, then send a real
        # Wayland keyboard shortcut. Moving focus into its text field must
        # produce another presented frame; receiving input without repainting
        # is the compositor-vsync deadlock this test is designed to catch.
        hyprctl dispatch focuswindow "address:$address" >/dev/null
        sleep 0.75
        set -- $(tail -n1 "$presentation_stats")
        input_baseline=$1
        hyprctl dispatch sendshortcut ",TAB,address:$address" >/dev/null
        input_presented=false
        for _ in $(seq 1 100); do
          set -- $(tail -n1 "$presentation_stats")
          if [ "$1" -gt "$input_baseline" ]; then
            input_presented=true
            break
          fi
          sleep 0.05
        done
        if [ "$input_presented" != true ]; then
          echo "Keyboard input produced no presented frame; stats: $presentation_stats; log: $stress_log" >&2
          exit 1
        fi

        workspace=$(hyprctl clients -j | jq -r --arg address "$address" \
          '.[] | select(.address == $address) | .workspace.id')
        hyprctl dispatch togglefloating "address:$address" >/dev/null
        for i in $(seq 1 {{.RESIZE_ITERATIONS}}); do
          width=$((320 + (i * 73) % 1250))
          height=$((240 + (i * 47) % 720))
          hyprctl dispatch resizewindowpixel \
            "exact $width $height,address:$address" >/dev/null
          if [ $((i % 30)) -eq 0 ]; then
            hyprctl dispatch movetoworkspacesilent \
              "special:rust-shell-stress,address:$address" >/dev/null
            hyprctl dispatch movetoworkspacesilent \
              "$workspace,address:$address" >/dev/null
          fi
          if [ $((i % 50)) -eq 0 ]; then
            hyprctl dispatch fullscreen "0,address:$address" >/dev/null
            hyprctl dispatch fullscreen "0,address:$address" >/dev/null
          fi
        done

        # Require a post-burst presentation whose configured framebuffer size
        # differs from the initial one. This catches a live process displaying
        # a permanently frozen pre-resize surface.
        set -- $(head -n1 "$presentation_stats")
        initial_width=$2
        initial_height=$3
        set -- $(tail -n1 "$presentation_stats")
        resize_baseline=$1
        hyprctl dispatch resizewindowpixel \
          "exact 911 677,address:$address" >/dev/null
        resize_presented=false
        for _ in $(seq 1 100); do
          set -- $(tail -n1 "$presentation_stats")
          if [ "$1" -gt "$resize_baseline" ] && \
             { [ "$2" -ne "$initial_width" ] || [ "$3" -ne "$initial_height" ]; }; then
            resize_presented=true
            break
          fi
          sleep 0.05
        done
        if [ "$resize_presented" != true ]; then
          echo "Resize produced no newly sized presented frame; stats: $presentation_stats; log: $stress_log" >&2
          exit 1
        fi

        # Close immediately after the resize burst so teardown overlaps work
        # already queued by the compositor and raster thread.
        hyprctl dispatch closewindow "address:$address" >/dev/null
        for _ in $(seq 1 100); do
          kill -0 "$runner_pid" 2>/dev/null || break
          sleep 0.05
        done
        if kill -0 "$runner_pid" 2>/dev/null; then
          echo "Flutter Rust shell did not exit after its window closed; log: $stress_log" >&2
          exit 1
        fi
        trap - EXIT

        if grep -Eqi \
          'VUID-|validation error|failed waiting on fences|semaphore.*error|invalid (Vk)?image|device lost' \
          "$stress_log"; then
          echo "Vulkan synchronization diagnostics found; log: $stress_log" >&2
          cat "$stress_log" >&2
          exit 1
        fi
        echo "Vulkan synchronization and frame-liveness stress passed ({{.RESIZE_ITERATIONS}} resizes); stats: $presentation_stats; log: $stress_log"
