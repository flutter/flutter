name: font_assets
description: Tests fonts that are provided by Dart build hooks.
version: 0.0.1

publish_to: none

environment:
  sdk: ^3.13.0-0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  font_asset: ^0.1.0
  font_asset_package:
    path: ../font_asset_package

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  config:
    # Font assets are part of the data assets experiment.
    enable-dart-data-assets: true

