<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML-in-Canvas Compositing Demo (SingleSurfaceRasterizer)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #90CAF9;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
  <script>
    const params = new URLSearchParams(window.location.search);
    // Allow overriding canvasKitBaseUrl, defaulting to local canvaskit or unpkg fallback
    const customCanvasKit = params.get('canvaskit');
    window.flutterConfiguration = {
      canvasKitBaseUrl: customCanvasKit || "./canvaskit/"
    };
  </script>
</head>
<body>
  <div id="loading">Initializing CanvasKit & HTML-in-Canvas Engine...</div>
  <script src="main.dart.js" onload="document.getElementById('loading')?.remove();"></script>
</body>
</html>
