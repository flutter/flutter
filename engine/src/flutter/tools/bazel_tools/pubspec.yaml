name: bazel_tools
description: Tooling that keeps the Bazel workspace in sync with DEPS and the GN build.

# We don't publish packages to pub.dev from the engine repository.
publish_to: none

# Required for workspace support.
environment:
  sdk: ^3.13.0-0

# This package is managed as part of the engine workspace.
resolution: workspace

dependencies:
  args: any
  meta: any
  path: any

dev_dependencies:
  test: any
