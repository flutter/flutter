name: gn_to_bazel
description: Converts the engine's GN build files to Bazel BUILD files.

# We don't publish packages to pub.dev from the engine repository.
publish_to: none

# Required for workspace support.
environment:
  sdk: ^3.13.0-0

# This package is managed as part of the engine workspace.
resolution: workspace

dependencies:
  args: any
  engine_build_configs: any
  meta: any
  path: any
  yaml: any

dev_dependencies:
  test: any
