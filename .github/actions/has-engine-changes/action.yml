name: 'Has Engine Changes'
description: 'Checks if there are any engine changes in the current branch'
outputs:
  changed:
    description: "Returns 'true' if there are engine changes, 'false' otherwise"
    value: ${{ steps.check.outputs.changed }}
  engine_sha:
    description: "Commit SHA that last modified engine-tracked files (HEAD if changed directly in this PR)"
    value: ${{ steps.check.outputs.engine_sha }}
runs:
  using: "composite"
  steps:
    - name: Fetch upstream master (if not flutter/flutter)
      if: github.repository != 'flutter/flutter' && !env.ACT
      shell: bash
      run: |
        if ! git remote get-url upstream >/dev/null 2>&1; then
          git remote add upstream https://github.com/flutter/flutter.git
        fi
        git fetch --no-tags upstream master

    - name: Check Engine Changes
      id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: ./.github/scripts/resolve_engine_change.sh
