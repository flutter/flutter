# Unprivileged half of the "no PRs on main" check.
#
# This workflow runs on `pull_request` with a read-only token and no access to
# secrets. It fails the check for PRs targeting `main` and uploads a
# `no-main-metadata` artifact so that the privileged `no-main-prs-comment.yaml`
# workflow can leave an explanatory comment on the pull request.

name: No PRs on main

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  reject-main-prs:
    runs-on: ubuntu-latest
    # Gating at the job level means PRs that don't target `main` never allocate
    # a runner. (A trigger-level `branches` filter is not used so that
    # retargeting a PR from `main` to `master` produces a new, skipped run
    # rather than leaving the previous failed run as the latest result.)
    if: ${{ github.repository == 'flutter/flutter' && github.base_ref == 'main' }}
    permissions:
      contents: read

    steps:
      - name: Record PR targeting main
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p no-main-metadata
          jq -n --arg pr "$PR_NUMBER" '{pr_number: $pr}' > no-main-metadata/metadata.json

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-main-metadata
          path: no-main-metadata/
          retention-days: 1
          if-no-files-found: error

      - name: Check base branch
        run: |
          echo "::error::Do not open PRs on \`main\`. The primary branch is \`master\`. You can change the base branch of this PR to \`master\`. See: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/changing-the-base-branch-of-a-pull-request"
          exit 1
