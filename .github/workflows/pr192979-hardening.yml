name: PR 192979 hardening

on:
  push:
    branches:
      - fix-desktop-semantics-hint

permissions:
  contents: write

jobs:
  harden-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add native macOS and null-clear coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          common = Path('engine/src/flutter/shell/platform/common/accessibility_bridge_unittests.cc')
          s = common.read_text()
          marker = ('  EXPECT_TRUE(platform_node->GetData()\n'
                    '                  .GetStringAttribute(ax::mojom::StringAttribute::kDescription)\n'
                    '                  .empty());\n'
                    '}\n\n'
                    '// Flutter used to assume that the accessibility root had ID 0.')
          replacement = ('  EXPECT_TRUE(platform_node->GetData()\n'
                         '                  .GetStringAttribute(ax::mojom::StringAttribute::kDescription)\n'
                         '                  .empty());\n\n'
                         '  node.hint = nullptr;\n'
                         '  bridge->AddFlutterSemanticsNodeUpdate(node);\n'
                         '  bridge->CommitUpdates();\n\n'
                         '  platform_node = bridge->GetFlutterPlatformNodeDelegateFromID(0).lock();\n'
                         '  ASSERT_TRUE(platform_node);\n'
                         '  EXPECT_TRUE(platform_node->GetData()\n'
                         '                  .GetStringAttribute(ax::mojom::StringAttribute::kDescription)\n'
                         '                  .empty());\n'
                         '}\n\n'
                         '// Flutter used to assume that the accessibility root had ID 0.')
          if marker not in s:
              raise SystemExit('common clear-test marker not found')
          common.write_text(s.replace(marker, replacement, 1))

          linux = Path('engine/src/flutter/shell/platform/linux/fl_view_accessible_test.cc')
          s = linux.read_text()
          marker = ("  const gchar* description = atk_object_get_description(root);\n"
                    "  EXPECT_TRUE(description == nullptr || description[0] == '\\0');\n\n"
                    "  g_object_unref(root);\n"
                    "}\n")
          replacement = ("  const gchar* description = atk_object_get_description(root);\n"
                         "  EXPECT_TRUE(description == nullptr || description[0] == '\\0');\n\n"
                         "  node.hint = nullptr;\n"
                         "  fl_view_accessible_handle_update_semantics(accessible, &update);\n"
                         "  description = atk_object_get_description(root);\n"
                         "  EXPECT_TRUE(description == nullptr || description[0] == '\\0');\n\n"
                         "  g_object_unref(root);\n"
                         "}\n")
          if marker not in s:
              raise SystemExit('linux clear-test marker not found')
          linux.write_text(s.replace(marker, replacement, 1))

          mac = Path('engine/src/flutter/shell/platform/darwin/macos/framework/Source/FlutterPlatformNodeDelegateMacTest.mm')
          s = mac.read_text()
          marker = '\nTEST(FlutterPlatformNodeDelegateMac, SelectableTextHasCorrectSemantics) {'
          if marker not in s:
              raise SystemExit('mac test insertion marker not found')
          lines = [
              '',
              'TEST(FlutterPlatformNodeDelegateMac, ExposesHintAsAccessibilityHelp) {',
              '  FlutterViewController* viewController = CreateTestViewController();',
              '  FlutterEngine* engine = viewController.engine;',
              '  [viewController loadView];',
              '  engine.semanticsEnabled = YES;',
              '  auto bridge = viewController.accessibilityBridge.lock();',
              '',
              '  FlutterSemanticsFlags flags = FlutterSemanticsFlags{};',
              '  FlutterSemanticsNode2 root = {};',
              '  root.id = 0;',
              '  root.flags2 = &flags;',
              '  root.text_selection_base = -1;',
              '  root.text_selection_extent = -1;',
              '  root.label = "Export";',
              '  root.hint = "Writes the visible range to a PNG file";',
              '  root.value = "";',
              '  root.increased_value = "";',
              '  root.decreased_value = "";',
              '  root.tooltip = "";',
              '  root.identifier = "";',
              '',
              '  bridge->AddFlutterSemanticsNodeUpdate(root);',
              '  bridge->CommitUpdates();',
              '',
              '  auto root_platform_node_delegate =',
              '      bridge->GetFlutterPlatformNodeDelegateFromID(0).lock();',
              '  ASSERT_TRUE(root_platform_node_delegate);',
              '  NSAccessibilityElement* native_accessibility =',
              '      root_platform_node_delegate->GetNativeViewAccessible();',
              '  ASSERT_NE(native_accessibility, nil);',
              '  EXPECT_TRUE([native_accessibility.accessibilityHelp',
              '      isEqualToString:@"Writes the visible range to a PNG file"]);',
              '',
              '  root.hint = "Writes the selected range to a PNG file";',
              '  bridge->AddFlutterSemanticsNodeUpdate(root);',
              '  bridge->CommitUpdates();',
              '  EXPECT_TRUE([native_accessibility.accessibilityHelp',
              '      isEqualToString:@"Writes the selected range to a PNG file"]);',
              '',
              '  root.hint = "";',
              '  bridge->AddFlutterSemanticsNodeUpdate(root);',
              '  bridge->CommitUpdates();',
              '  EXPECT_TRUE(native_accessibility.accessibilityHelp == nil ||',
              '              native_accessibility.accessibilityHelp.length == 0);',
              '',
              '  [engine shutDownEngine];',
              '}',
              '',
          ]
          insert = '\n'.join(lines)
          mac.write_text(s.replace(marker, insert + 'TEST(FlutterPlatformNodeDelegateMac, SelectableTextHasCorrectSemantics) {', 1))
          PY
      - name: Format modified tests
        run: |
          clang-format -i \
            engine/src/flutter/shell/platform/linux/fl_view_accessible_test.cc \
            engine/src/flutter/shell/platform/darwin/macos/framework/Source/FlutterPlatformNodeDelegateMacTest.mm
      - name: Check whitespace
        run: git diff --check
      - name: Check C and C++ formatting
        run: |
          clang-format --dry-run --Werror \
            engine/src/flutter/shell/platform/common/accessibility_bridge.cc \
            engine/src/flutter/shell/platform/common/accessibility_bridge.h \
            engine/src/flutter/shell/platform/common/accessibility_bridge_unittests.cc \
            engine/src/flutter/shell/platform/linux/fl_view_accessible.cc \
            engine/src/flutter/shell/platform/linux/fl_view_accessible_test.cc \
            engine/src/flutter/shell/platform/darwin/macos/framework/Source/FlutterPlatformNodeDelegateMacTest.mm
      - name: Commit hardening and remove temporary workflow
        run: |
          git config user.name "Yazan Arafeh"
          git config user.email "32390922+yazanmg@users.noreply.github.com"
          git add engine/src/flutter/shell/platform/common/accessibility_bridge_unittests.cc engine/src/flutter/shell/platform/linux/fl_view_accessible_test.cc engine/src/flutter/shell/platform/darwin/macos/framework/Source/FlutterPlatformNodeDelegateMacTest.mm
          git rm .github/workflows/pr192979-hardening.yml
          git commit -m "Strengthen desktop semantics hint coverage"
          git push origin HEAD:fix-desktop-semantics-hint
