name: iOS Personal Training App Build

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: Build environment passed as APP_ENV
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  build-ios:
    runs-on: macos-14
    env:
      APP_DIR: examples/personal_training_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager in CI
        run: flutter config --no-enable-swift-package-manager

      - name: Prepare iOS build directories
        run: |
          mkdir -p build/ios/SourcePackages
        working-directory: ${{ env.APP_DIR }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Install CocoaPods dependencies
        run: |
          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' -E "s/^platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          else
            cp ios/Podfile ios/Podfile.bak
            {
              echo "platform :ios, '15.0'"
              cat ios/Podfile.bak
            } > ios/Podfile
          fi

          if ! grep -q "use_modular_headers!" ios/Podfile; then
            awk 'NR==1 {print; print "use_modular_headers!"; next} {print}' ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi

          head -n 20 ios/Podfile
          cd ios
          pod install --repo-update
        working-directory: ${{ env.APP_DIR }}

      - name: Build iOS IPA for App Store
        run: |
          mkdir -p build/ios/SourcePackages
          flutter build ipa \
            --release \
            --dart-define=APP_ENV=${{ inputs.app_env }} \
            --export-options-plist=ios/ExportOptions-AppStore.plist
        working-directory: ${{ env.APP_DIR }}

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa-${{ inputs.app_env }}
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          if-no-files-found: error
