name: Tree Analyze

on:
  pull_request:
    branches: [master]
  merge_group:
    branches: [master]

jobs:
  Tree_analyze:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      # Note: we must check out the tree for the composite action to be available
      - name: Checkout code
        if: env.ACT != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout code (act local)
        if: env.ACT
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Wait for Engine Build
        uses: ./.github/actions/wait-for-engine-build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: 'Linux linux_host_engine,Linux linux_android_debug_engine'

      - uses: ./.github/actions/composite-flutter-setup

      - name: Check Engine Changes (fork repositories)
        id: fork_engine_changes
        if: github.repository != 'flutter/flutter'
        uses: ./.github/actions/has-engine-changes

      # Syncs local dart:ui and dart:ui_web Dart sources on fork repositories where
      # LUCI does not build flutter_archives_v2 (does not cover DEPS Dart SDK rolls).
      - name: Sync local sky_engine Dart sources (fork repositories)
        if: steps.fork_engine_changes.outputs.changed == 'true' && github.repository != 'flutter/flutter'
        shell: bash
        run: |
          echo "Syncing local dart:ui and dart:ui_web sources into bin/cache/pkg/sky_engine for fork analysis..."
          mkdir -p bin/cache/pkg/sky_engine/lib/ui bin/cache/pkg/sky_engine/lib/fix_data bin/cache/pkg/sky_engine/lib/ui_web
          rm -rf bin/cache/pkg/sky_engine/lib/ui/*.dart bin/cache/pkg/sky_engine/lib/ui_web/*
          cp engine/src/flutter/lib/ui/*.dart bin/cache/pkg/sky_engine/lib/ui/
          cp engine/src/flutter/lib/ui/fix_dart_ui.yaml bin/cache/pkg/sky_engine/lib/fix_data/fix_dart_ui.yaml
          TMP_REWRITE="$(mktemp -d)"
          ./bin/cache/dart-sdk/bin/dart --packages=.dart_tool/package_config.json \
            engine/src/flutter/web_sdk/sdk_rewriter.dart \
            --output-dir=bin/cache/pkg/sky_engine/lib/ui_web/ \
            --input-dir=engine/src/flutter/lib/web_ui/lib/ui_web/src/ui_web/ \
            --public \
            --library-name=ui_web \
            --api-file=engine/src/flutter/lib/web_ui/lib/ui_web/src/ui_web.dart \
            --stamp="$TMP_REWRITE/ui_web.stamp" \
            --depfile="$TMP_REWRITE/ui_web.d" \
            --build-dir="."
          rm -rf "$TMP_REWRITE"

      - name: Run Analyze
        run: |
          SHARD=analyze LUCI_CI=true dart --enable-asserts dev/bots/test.dart
