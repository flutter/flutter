# Privileged half of the pull request labeler.
#
# Runs after `labeler-trigger.yml` completes. The artifact produced by that
# workflow is UNTRUSTED (a pull request can modify the trigger workflow), so the
# PR number is only used after binding it to the triggering run's head commit.
# The label configuration is read from the default branch, not the PR. Before
# applying labels, it waits for the `cla/google` check run to complete; if the
# CLA check fails, it skips labeling and moves the PR to a draft state.
#
# Pull requests from first-time contributors need a maintainer to approve their
# `pull_request` runs. Until then, the trigger run is created already concluded
# as `action_required`, without running anything or uploading an artifact. That
# run fires the `requested` event (but not `completed`), so on `requested` with
# `action_required` the PR is looked up from the run's head branch and SHA
# instead. Otherwise those PRs would get no `team-*` labels, and would not show
# up in the triage queries where maintainers find runs to approve.

name: "Pull Request Labeler"
on:
  # Safe because this only consumes an artifact from the triggering run as
  # untrusted data (validated and bound to the PR's head SHA); no PR code is
  # checked out or executed.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Pull Request Labeler Trigger]
    types: [requested, completed]

# Declare default permissions as read only.
permissions: read-all

jobs:
  triage:
    if: >-
      github.repository == 'flutter/flutter' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/labeler-trigger.yml' &&
      ((github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success') ||
       (github.event.action == 'requested' && github.event.workflow_run.conclusion == 'action_required'))
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Download labeler metadata
      if: github.event.action == 'completed'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: labeler-metadata
        path: ${{ runner.temp }}/labeler-metadata
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Validate PR
      id: validate
      env:
        EVENT_ACTION: ${{ github.event.action }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_ACTION" = "requested" ]; then
          # Awaiting approval: no artifact, so find the open PR for the run's
          # head branch. This only uses data from GitHub's event payload.
          PR_NUMBER=$(gh api -X GET "repos/$REPO/pulls" \
            -f state=open -f head="$RUN_HEAD_OWNER:$RUN_HEAD_BRANCH" |
            jq -r --arg sha "$RUN_HEAD_SHA" '[.[] | select(.head.sha == $sha)] | .[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open PR found for $RUN_HEAD_OWNER:$RUN_HEAD_BRANCH at $RUN_HEAD_SHA; skipping."
            exit 0
          fi
        else
          PR_NUMBER=$(jq -r '.pr_number // empty' "$RUNNER_TEMP/labeler-metadata/metadata.json")
        fi
        if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::Invalid PR number."
          exit 1
        fi

        # Bind the PR number to the pull request that actually triggered the run.
        gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
        if [ "$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" != "$RUN_HEAD_SHA" ] ||
           [ "$(jq -r '.head.repo.full_name // empty' "$RUNNER_TEMP/pr.json")" != "$RUN_HEAD_REPO" ]; then
          # Most likely a newer push; its own run will label the PR.
          echo "::notice::PR #$PR_NUMBER has changed since the trigger ran; skipping."
          exit 0
        fi
        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

    - name: Check CLA
      id: cla
      if: steps.validate.outputs.pr_number != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        REPO: ${{ github.repository }}
        RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        CLA_STATUS=""
        CLA_CONCLUSION=""
        for attempt in $(seq 1 12); do
          CHECK_JSON=$(gh api -X GET "repos/$REPO/commits/$RUN_HEAD_SHA/check-runs" \
            -f check_name="cla/google" -f filter="latest")
          CLA_STATUS=$(echo "$CHECK_JSON" | jq -r '.check_runs[0].status // empty')
          CLA_CONCLUSION=$(echo "$CHECK_JSON" | jq -r '.check_runs[0].conclusion // empty')
          if [ "$CLA_STATUS" = "completed" ]; then
            break
          fi
          echo "Waiting for cla/google check run to complete (attempt $attempt/12, status: ${CLA_STATUS:-not found})..."
          sleep 5
        done

        if [ "$CLA_STATUS" != "completed" ]; then
          echo "::warning::cla/google check run did not complete within 60 seconds (status: ${CLA_STATUS:-not found}); skipping labeling."
          echo "cla_passed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$CLA_CONCLUSION" = "success" ]; then
          echo "cla/google check passed."
          echo "cla_passed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "::notice::cla/google check concluded with '$CLA_CONCLUSION' on PR #$PR_NUMBER; skipping labeling."
        echo "cla_passed=false" >> "$GITHUB_OUTPUT"

        # Re-fetch PR state in case it was closed or converted to draft while waiting.
        PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
        if [ "$(echo "$PR_JSON" | jq -r '.state')" != "open" ] ||
           [ "$(echo "$PR_JSON" | jq -r '.draft')" = "true" ]; then
          exit 0
        fi

        echo "Converting PR #$PR_NUMBER to draft..."
        gh pr ready "$PR_NUMBER" -R "$REPO" --undo

        COMMENT_BODY="This pull request has been moved to a draft state because the \`cla/google\` check failed. Once you have signed the CLA and the \`cla/google\` check is passing, please mark this pull request as **Ready for review**."
        ALREADY_COMMENTED=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" |
          jq -sr --arg body "$COMMENT_BODY" '[.[][] | select(.body == $body)] | length > 0')
        if [ "$ALREADY_COMMENTED" != "true" ]; then
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "$COMMENT_BODY"
        fi

    # Source available at https://github.com/actions/labeler/blob/main/README.md
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
      if: steps.validate.outputs.pr_number != '' && steps.cla.outputs.cla_passed == 'true'
      with:
        pr-number: ${{ steps.validate.outputs.pr_number }}
        sync-labels: true
