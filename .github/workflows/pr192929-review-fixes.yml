name: PR 192929 review fixes

on:
  push:
    branches:
      - fix-rtl-table-semantics-index

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/flutter/flutter.git || true
          git fetch upstream --tags --force
      - name: Apply review fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/flutter/lib/src/rendering/table.dart')
          s = p.read_text()
          old = '''    int logicalColumnIndexForVisualIndex(int visualIndex) {
      return switch (textDirection) {
        TextDirection.ltr => visualIndex,
        TextDirection.rtl => _columns - visualIndex - 1,
      };
    }

    int findColumnIndex(double left) {'''
          new = '''    final bool isRtl = textDirection == TextDirection.rtl;

    int findColumnIndex(double left) {'''
          if old not in s:
              raise SystemExit('helper block not found')
          s = s.replace(old, new, 1)
          s = s.replace('return logicalColumnIndexForVisualIndex(i);', 'return isRtl ? _columns - i - 1 : i;', 1)
          s = s.replace('final int x = logicalColumnIndexForVisualIndex(visualX);', 'final int x = isRtl ? _columns - visualX - 1 : visualX;', 1)
          p.write_text(s)
          PY
      - name: Format changed Dart files
        run: ./bin/dart format packages/flutter/lib/src/rendering/table.dart packages/flutter/test/widgets/table_semantics_test.dart
      - name: Run table semantics regression tests
        run: ./bin/flutter test packages/flutter/test/widgets/table_semantics_test.dart
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "Yazan Arafeh"
          git config user.email "32390922+yazanmg@users.noreply.github.com"
          git add packages/flutter/lib/src/rendering/table.dart packages/flutter/test/widgets/table_semantics_test.dart
          git rm .github/workflows/pr192929-review-fixes.yml
          git commit -m "Address RTL table semantics review feedback"
          git push origin HEAD:fix-rtl-table-semantics-index
