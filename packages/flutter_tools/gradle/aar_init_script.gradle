// This script is used to initialize the build in a module or plugin project.
// During this phase, the script applies the Maven plugin and configures the
// destination of the local repository.
// The local repository will contain the AAR and POM files.

import java.nio.file.Paths


void configureProject(Project project, String outputDir) {
    if (!project.hasProperty("android")) {
        throw new GradleException("Android property not found.")
    }
    if (!project.pluginManager.hasPlugin("com.android.library")) {
        throw new GradleException("Can't generate AAR on a non Android library project.")
    }

    // Snapshot versions include the timestamp in the artifact name.
    // Therefore, remove the snapshot part, so new runs of `flutter build aar` overrides existing artifacts.
    // This version isn't relevant in Flutter since the pub version is used
    // to resolve dependencies.
    project.version = project.version.replace("-SNAPSHOT", "")

    if (project.hasProperty("buildNumber")) {
        project.version = project.property("buildNumber")
    }

    aarComponents(project).each { component ->
        addAarTask(project, component)
    }

    project.publishing {
        repositories {
            maven {
                url = project.file("${outputDir}/outputs/repo").toURI()
            }
        }
    }

    if (!project.property("is-plugin").toBoolean()) {
        return
    }

    String storageUrl = System.getenv('FLUTTER_STORAGE_BASE_URL') ?: "https://storage.googleapis.com"

    String engineRealm = Paths.get(getFlutterRoot(project), "bin", "cache", "engine.realm")
        .toFile().text.trim()
    if (engineRealm) {
        engineRealm += "/"
    }

    // This is a Flutter plugin project. Plugin projects don't apply the Flutter Gradle plugin,
    // as a result, add the dependency on the embedding.
    project.repositories {
        maven {
            url "$storageUrl/${engineRealm}download.flutter.io"
        }
    }
    String engineVersion = Paths.get(getFlutterRoot(project), "bin", "cache", "engine.stamp")
        .toFile().text.trim()
    project.dependencies {
        // Add the embedding dependency.
        compileOnly ("io.flutter:flutter_embedding_release:1.0.0-$engineVersion") {
            // We only need to expose io.flutter.plugin.*
            // No need for the embedding transitive dependencies.
            transitive = false
        }
    }
}

void configurePlugin(Project project, String outputDir) {
    if (!project.hasProperty("android")) {
        // A plugin doesn't support the Android platform when this property isn't defined in the plugin.
        return
    }
    configureProject(project, outputDir)
}

static String getFlutterRoot(Project project) {
    if (!project.hasProperty("flutter-root")) {
        throw new GradleException("The `-Pflutter-root` flag must be specified.")
    }
    return project.property("flutter-root")
}

// Every software component of the project except "all". AGP adds one component for each
// `singleVariant` or `multipleVariants` publishing declaration, named after it. `addAarTask`
// registers one `assembleAar<Variant>` task for each.
static Collection<SoftwareComponent> aarComponents(Project project) {
    return project.components.findAll { it.name != "all" }
}

// Builds the task name that the tool requests (`getAarTaskFor` in
// packages/flutter_tools/lib/src/android/gradle.dart).
static String aarTaskName(String variantName) {
    return "assembleAar${variantName.capitalize()}"
}

void addAarTask(Project project, component) {
    String taskName = aarTaskName(component.name)
    project.tasks.register(taskName) {
        // Generate the Maven artifacts.
        finalizedBy "publish"
    }

    // Only requested variants get a publication, so the `publish` finalizer publishes only those.
    if (!project.gradle.startParameter.taskNames.contains(taskName)) {
        return
    }

    // Create a default MavenPublication for the variant.
    // This runs outside the task's configuration action because maven-publish registers tasks for
    // each publication, and Gradle doesn't allow registering tasks while it realizes a task.
    project.publishing.publications.create(component.name, MavenPublication) { pub ->
        groupId = "${pub.groupId}"
        artifactId = "${pub.artifactId}_${pub.name}"
        version = "${pub.version}"
        from component
    }
}

// AGP reports this error when `singleVariant` is declared twice for one variant
// (`checkSingleVariantUniqueness`, same text in AGP 8.11.1, 9.1.0 and 9.3.1:
// https://android.googlesource.com/platform/tools/base/+/refs/tags/studio-2025.3.2/build-system/gradle-core/src/main/java/com/android/build/gradle/internal/dsl/AbstractPublishing.kt#38).
// Its class, com.android.builder.errors.EvalIssueException, is not public AGP API and is not on
// this script's classpath, so the error is matched by its message.
static boolean isDuplicateSingleVariantError(Exception e, String variantName) {
    String duplicateMessage = "Using singleVariant publishing DSL multiple times to publish " +
            "variant \"$variantName\" to component \"$variantName\" is not allowed."
    return e.message == duplicateMessage
}

// Checks that the module and each Android plugin have every variant whose `assembleAar<Variant>`
// task the tool requested. Returns normally if they do. Otherwise throws a GradleException that
// names the variant and the first project without it. A requested task that matches no project's
// variant (for example a misspelled `--flavor`) is left to Gradle, which fails with
// `Task '<name>' not found in root project`.
//
// A project without the requested variant publishes no AAR, and the module's POM depends on each
// plugin's AAR for the same variant name.
void checkProjectsHaveRequestedVariants(Project moduleProject, Collection<Project> pluginProjects) {
    Collection<Project> androidPlugins = pluginProjects.findAll { it.hasProperty("android") }
    Map<Project, Set<String>> variantsByProject = ([moduleProject] + androidPlugins).collectEntries {
        [(it): aarComponents(it).collect { component -> component.name } as Set]
    }
    List<String> requestedTasks = moduleProject.gradle.startParameter.taskNames
    Set<String> requestedVariants = variantsByProject.values().flatten().findAll {
        requestedTasks.contains(aarTaskName(it))
    } as Set
    requestedVariants.each { variantName ->
        if (!variantsByProject[moduleProject].contains(variantName)) {
            String moduleVariants = variantsByProject[moduleProject].sort().join(", ")
            throw new GradleException(
                    "Flutter can't build the AAR for variant '$variantName' because module " +
                    "project '${moduleProject.path}' has no variant with that name. Its variants " +
                    "are: $moduleVariants. Pass the module's product flavor with --flavor, or " +
                    "omit --flavor if the module has no product flavors."
            )
        }
        androidPlugins.each { pluginProject ->
            if (!variantsByProject[pluginProject].contains(variantName)) {
                throw new GradleException(
                        "Flutter can't build the AAR for variant '$variantName' because plugin " +
                        "project '${pluginProject.path}' has no variant with that name, so the " +
                        "plugin AAR that the module depends on can't be published. " +
                        "`flutter build aar` requires the module and each of its Android " +
                        "plugins to declare the same product flavors."
                )
            }
        }
    }
}

// maven-publish has to be applied _before_ the project gets evaluated, but some of the code in
// `configureProject` requires the project to be evaluated. Apply the maven plugin to all projects, but
// only configure it if it matches the conditions in `projectsEvaluated`

allprojects {
   apply plugin: "maven-publish"
}

afterProject { project ->
    // Exit early if the project doesn't have the Android Gradle plugin applied.
    if (!project.hasProperty("android")) {
        return
    }

    // afterProject runs after the project's build file, so AGP rejects a variant that the build
    // file already declared. The public `Publishing` DSL can declare variants but not list them,
    // so ignoring only that error is how the build file's declaration is kept. Any other error
    // fails the build.
    Closure addSingleVariant = { String variantName ->
        try {
            project.android.publishing.singleVariant(variantName) {
                withSourcesJar()
                withJavadocJar()
            }
        } catch (Exception e) {
            if (!isDuplicateSingleVariantError(e, variantName)) {
                throw e
            }
        }
    }

    Closure addSingleVariants = {buildType ->
        if (!project.android.productFlavors.isEmpty()) {
            project.android.productFlavors.all{productFlavor ->
                addSingleVariant(productFlavor.name + buildType.name.capitalize())
            }
        } else {
            addSingleVariant(buildType.name)
        }
    }

    project.android.buildTypes.all(addSingleVariants)
}

projectsEvaluated {
    assert rootProject.hasProperty("is-plugin")
    if (rootProject.property("is-plugin").toBoolean()) {
        assert rootProject.hasProperty("output-dir")
        // In plugin projects, the root project is the plugin.
        configureProject(rootProject, rootProject.property("output-dir"))
        return
    }
    if (rootProject.name == "gradle") {
        // Skip the "gradle" project, we are looking only for the "android_generated" project.
        return
    }
    // The module project is the `:flutter` subproject.
    Project moduleProject = rootProject.subprojects.find { it.name == "flutter" }
    assert moduleProject != null
    assert moduleProject.hasProperty("output-dir")
    configureProject(moduleProject, moduleProject.property("output-dir"))

    // Gets the plugin subprojects.
    Set<Project> modulePlugins = rootProject.subprojects.findAll {
        it.name != "flutter" && it.name != "app"
    }
    // When a module is built as a Maven artifacts, plugins must also be built this way
    // because the module POM's file will include a dependency on the plugin Maven artifact.
    // This is due to the Android Gradle Plugin expecting all library subprojects to be published
    // as Maven artifacts.
    // The tool requests `assembleAar<Variant>` by name, without a project path, so Gradle runs it
    // in every project that has it, and each plugin publishes its own AAR.
    modulePlugins.each { pluginProject ->
        configurePlugin(pluginProject, moduleProject.property("output-dir"))
    }
    checkProjectsHaveRequestedVariants(moduleProject, modulePlugins)
}
